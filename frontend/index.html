<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharma Research Agent</title>
<style>
  :root{
    --bg:#f4f8f9;
    --surface:#ffffff;
    --ink:#0f2b33;
    --muted:#5b7a83;
    --line:#dbe8ea;
    --primary:#0e8f8f;
    --primary-2:#12b8a6;
    --primary-dark:#0a6f6f;
    --radius:20px;
    --shadow:0 18px 40px -24px rgba(13,80,90,.45);
  }

  *{box-sizing:border-box}

  body{
    margin:0; min-height:100vh;
    font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 500px at 8% -10%, #d9f2ef 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #e3eefb 0%, transparent 55%),
      var(--bg);
    padding:36px 16px 72px;
    -webkit-font-smoothing:antialiased;
  }

  .app{max-width:880px;margin:0 auto}

  /* ---------- En-tête ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:26px;
  }
  .brand{display:flex; align-items:center; gap:14px}
  .logo{
    width:48px;height:48px;border-radius:14px;flex:none;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(140deg, var(--primary-2), var(--primary-dark));
    box-shadow:0 10px 22px -10px rgba(14,143,143,.95);
  }
  .logo svg{width:24px;height:24px}
  .brand h1{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:700}
  .brand p{margin:3px 0 0;font-size:13px;color:var(--muted)}

  .badge{
    font-size:12px;font-weight:600;color:var(--primary-dark);
    background:#e6f6f4;border:1px solid #c9e9e4;
    padding:7px 13px;border-radius:999px;white-space:nowrap;
  }

  /* ---------- Carte de saisie ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    box-shadow:var(--shadow);
  }

  .field-label{
    display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:10px;
  }

  textarea{
    width:100%;min-height:112px;resize:vertical;
    padding:15px 16px;border-radius:14px;
    border:1.5px solid var(--line);background:#fbfdfd;
    font:inherit;font-size:15px;line-height:1.6;color:var(--ink);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  textarea::placeholder{color:#9ab4ba}
  textarea:focus{
    outline:none;border-color:var(--primary);background:#fff;
    box-shadow:0 0 0 4px rgba(14,143,143,.13);
  }

  .actions{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;
  }

  button.primary{
    display:inline-flex;align-items:center;gap:9px;
    padding:12px 24px;border:none;border-radius:12px;
    background:linear-gradient(135deg, var(--primary-2), var(--primary-dark));
    color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 12px 22px -12px rgba(10,111,111,.95);
    transition:transform .12s, box-shadow .18s, filter .18s;
  }
  button.primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
  button.primary:active:not(:disabled){transform:translateY(0)}
  button.primary:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

  .spinner{
    width:15px;height:15px;border-radius:50%;display:none;flex:none;
    border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  .spinner.dark{
    display:inline-block;
    border-color:rgba(14,143,143,.25);border-top-color:var(--primary);
  }
  button.loading .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hint{font-size:12.5px;color:var(--muted)}

  /* ============================================================
     CARTE DE RÉPONSE  (élément central, très visible)
     ============================================================ */
  .answer-card{
    margin-top:24px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 22px 48px -28px rgba(13,80,90,.65);
    overflow:hidden;
    display:none;
    animation:rise .32s cubic-bezier(.2,.7,.3,1);
  }
  .answer-card.visible{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* En-tête de la carte */
  .answer-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 22px;
    background:linear-gradient(135deg,#e9f8f6 0%,#e4f1fb 100%);
    border-bottom:1px solid var(--line);
  }
  .answer-title{
    display:flex;align-items:center;gap:10px;
    font-size:14px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;color:var(--primary-dark);
  }
  .answer-title svg{width:18px;height:18px;flex:none}

  .copy-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:9px;cursor:pointer;
    background:#fff;border:1px solid #bfe4df;
    color:var(--primary-dark);font:inherit;font-size:12.5px;font-weight:600;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .copy-btn:hover{background:#f0fbfa;border-color:var(--primary-2)}
  .copy-btn:active{transform:scale(.97)}
  .copy-btn svg{width:13px;height:13px}

  /* Corps de la réponse — lisible et aéré */
  .answer-body{
    padding:26px 30px 28px;
    font-size:16px;
    line-height:1.85;
    color:#10303a;
    word-wrap:break-word;
  }
  .answer-body > :first-child{margin-top:0}
  .answer-body > :last-child{margin-bottom:0}

  .answer-body p{margin:0 0 15px}
  .answer-body h1,.answer-body h2,.answer-body h3{
    margin:26px 0 12px;
    font-size:17px;font-weight:700;color:var(--primary-dark);
    letter-spacing:-.01em;
    padding-left:12px;border-left:3px solid var(--primary-2);
  }
  .answer-body ul,.answer-body ol{
    margin:0 0 16px;padding-left:24px;
  }
  .answer-body li{margin:7px 0;padding-left:2px}
  .answer-body li::marker{color:var(--primary)}
  .answer-body strong{color:#06504f;font-weight:700}
  .answer-body em{color:var(--muted)}
  .answer-body code{
    background:#eef6f5;color:#0a5c5c;
    padding:2px 6px;border-radius:6px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;
  }
  .answer-body hr{
    border:none;border-top:1px solid var(--line);margin:22px 0;
  }

  /* États */
  .answer-body.loading{
    display:flex;align-items:center;gap:12px;
    color:var(--muted);font-style:italic;font-size:15px;
  }
  .answer-card.error .answer-head{background:#fff1f2;border-bottom-color:#fecdd3}
  .answer-card.error .answer-title{color:#9f1239}
  .answer-card.error .answer-body{color:#9f1239;font-weight:600}

  /* Pied : sources */
  .answer-sources{
    padding:16px 22px 20px;
    border-top:1px dashed var(--line);
    background:#fbfdfd;
    display:none;
  }
  .answer-sources.visible{display:block}
  .sources-label{
    display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:10px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#e8f6f4;color:var(--primary-dark);
    border:1px solid #c9e9e4;border-radius:999px;
    padding:6px 12px;font-size:12.5px;font-weight:600;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip svg{width:12px;height:12px;flex:none;opacity:.75}

  /* ---------- Debug ---------- */
  details.debug{
    margin-top:22px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:0 10px 26px -22px rgba(13,80,90,.6);
  }
  details.debug summary{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;cursor:pointer;list-style:none;
    font-size:13.5px;font-weight:600;color:var(--muted);
    user-select:none;
  }
  details.debug summary::-webkit-details-marker{display:none}
  details.debug summary::before{
    content:"▸";font-size:12px;transition:transform .2s;display:inline-block;
  }
  details.debug[open] summary::before{transform:rotate(90deg)}
  details.debug summary:hover{color:var(--primary-dark)}

  pre#debug{
    margin:0;padding:16px 18px;max-height:420px;overflow:auto;
    background:#0d2126;color:#bfeee6;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.65;
    border-top:1px solid var(--line);
  }

  @media (max-width:560px){
    body{padding:20px 12px 48px}
    .card{padding:18px}
    .brand h1{font-size:17px}
    .badge{display:none}
    button.primary{width:100%;justify-content:center}
    .hint{width:100%;text-align:center}
    .answer-body{padding:20px 18px;font-size:15.5px}
    .answer-head{padding:13px 16px}
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round">
          <path d="M12 4v16M4 12h16"/>
        </svg>
      </div>
      <div>
        <h1>Pharma Research Agent</h1>
        <p>Interactions · Contre-indications · Posologies — réponses sourcées</p>
      </div>
    </div>
    <span class="badge">RAG · Evidence-based</span>
  </header>

  <main class="card">
    <label class="field-label" for="q">Votre question clinique</label>
    <textarea id="q"
      placeholder="Ex : Compare les contre-indications de la warfarine et de l'apixaban."></textarea>

    <div class="actions">
      <button id="btn" class="primary" onclick="ask()">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnLabel">Analyser</span>
      </button>
      <span class="hint">Ctrl + Entrée pour envoyer</span>
    </div>
  </main>

  <!-- ===================== CARTE DE RÉPONSE ===================== -->
  <section id="answerCard" class="answer-card" aria-live="polite">
    <div class="answer-head">
      <div class="answer-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12h6M9 16h6M9 8h6"/>
          <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
        </svg>
        Réponse de l'agent
      </div>
      <button id="copyBtn" class="copy-btn" onclick="copyAnswer()" title="Copier la réponse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
        </svg>
        <span id="copyLabel">Copier</span>
      </button>
    </div>

    <div id="answerBody" class="answer-body"></div>

    <div id="sourcesBox" class="answer-sources">
      <span class="sources-label">Sources utilisées</span>
      <div id="sources" class="chips"></div>
    </div>
  </section>

  <details class="debug">
    <summary>Plan · Outils utilisés · Revue</summary>
    <pre id="debug">Aucun appel pour l'instant.</pre>
  </details>

</div>

<script>
const btn       = document.getElementById('btn');
const btnLabel  = document.getElementById('btnLabel');
const input     = document.getElementById('q');
const card      = document.getElementById('answerCard');
const body      = document.getElementById('answerBody');
const srcBox    = document.getElementById('sourcesBox');
const srcEl     = document.getElementById('sources');
const copyBtn   = document.getElementById('copyBtn');
const copyLabel = document.getElementById('copyLabel');
const dbgEl     = document.getElementById('debug');

let currentAnswer = '';

/* ---------- utilitaires ---------- */
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

/* Rendu Markdown léger : titres, listes, gras, code, paragraphes */
function renderMarkdown(text){
  const lines = escapeHtml(text).split('\n');
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  let html = '', listType = null, buffer = [];

  const flushPara = () => {
    if(buffer.length){ html += '<p>' + inline(buffer.join(' ')) + '</p>'; buffer = []; }
  };
  const closeList = () => { if(listType){ html += `</${listType}>`; listType = null; } };

  for(const raw of lines){
    const line = raw.trim();

    if(!line){ flushPara(); closeList(); continue; }

    let m;
    if((m = line.match(/^#{1,6}\s+(.*)$/))){                 // ### Titre
      flushPara(); closeList(); html += '<h3>' + inline(m[1]) + '</h3>'; continue;
    }
    if((m = line.match(/^[-*•]\s+(.*)$/))){                  // - puce
      flushPara();
      if(listType !== 'ul'){ closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + inline(m[1]) + '</li>'; continue;
    }
    if((m = line.match(/^\d+[.)]\s+(.*)$/))){                // 1. numéro
      flushPara();
      if(listType !== 'ol'){ closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + inline(m[1]) + '</li>'; continue;
    }
    if(/^(-{3,}|\*{3,})$/.test(line)){                        // --- séparateur
      flushPara(); closeList(); html += '<hr>'; continue;
    }

    closeList();
    buffer.push(line);
  }
  flushPara(); closeList();
  return html || '<p><em>(réponse vide)</em></p>';
}

/* ---------- états de la carte ---------- */
function showLoading(){
  currentAnswer = '';
  card.className = 'answer-card visible';
  srcBox.classList.remove('visible');
  copyBtn.style.display = 'none';
  body.className = 'answer-body loading';
  body.innerHTML = '<span class="spinner dark"></span> Recherche dans les sources et vérification des preuves…';
}

function showError(msg){
  currentAnswer = '';
  card.className = 'answer-card visible error';
  srcBox.classList.remove('visible');
  copyBtn.style.display = 'none';
  body.className = 'answer-body';
  body.innerHTML = '<p>Erreur : ' + escapeHtml(msg) + '</p>';
}

function showAnswer(text, sources){
  currentAnswer = text;
  card.className = 'answer-card visible';
  copyBtn.style.display = '';
  copyLabel.textContent = 'Copier';
  body.className = 'answer-body';
  body.innerHTML = renderMarkdown(text);

  if(sources.length){
    srcBox.classList.add('visible');
    srcEl.innerHTML = sources.map(s => `
      <span class="chip" title="${escapeHtml(s)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/>
          <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/>
        </svg>${escapeHtml(s)}
      </span>`).join('');
  } else {
    srcBox.classList.remove('visible');
  }

  card.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- copie ---------- */
async function copyAnswer(){
  if(!currentAnswer) return;
  try{
    await navigator.clipboard.writeText(currentAnswer);
    copyLabel.textContent = 'Copié ✓';
  }catch{
    copyLabel.textContent = 'Échec';
  }
  setTimeout(() => copyLabel.textContent = 'Copier', 1700);
}

/* ---------- appel API ---------- */
async function ask(){
  const question = input.value.trim();
  if(!question){ input.focus(); return; }

  btn.disabled = true;
  btn.classList.add('loading');
  btnLabel.textContent = 'Analyse…';
  showLoading();

  try{
    const r = await fetch('/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question})
    });

    const raw = await r.text();
    let d;
    try { d = JSON.parse(raw); }
    catch { throw new Error(raw.slice(0,200) || 'Réponse invalide du serveur'); }

    if(!r.ok) throw new Error(d.detail || ('Erreur HTTP ' + r.status));

    const sources = Array.isArray(d.sources) ? d.sources : [];
    showAnswer(d.answer ?? '(réponse vide)', sources);

    dbgEl.textContent = JSON.stringify(
      {plan: d.plan, tool_calls: d.tool_calls, review: d.review},
      null, 2
    );

  }catch(e){
    showError(e.message);
  }finally{
    btn.disabled = false;
    btn.classList.remove('loading');
    btnLabel.textContent = 'Analyser';
  }
}

input.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter') ask();
});
</script>
</body>
</html>
